<!-- templates/profile.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль пользователя</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'usersapp/css/profilestyle.css' %}">
</head>
<body>
    <div class="profile-container">
<!--         {% if messages %}-->
<!--        <div class="messages">-->
<!--            {% for message in messages %}-->
<!--            <div class="alert alert-{{ message.tags }}">-->
<!--                {{ message }}-->
<!--        </div>-->
<!--        {% endfor %}-->
<!--        </div>-->
<!--        {% endif %}-->
        <h2>Мой профиль</h2>
        {% if profile.avatar %}
            <img src="{{ profile.avatar.url }}" alt="Аватар" class="profile-avatar">
        {% else %}
            <img src="{% static 'usersapp/img/profileicon.png' %}" alt="Аватар" class="profile-avatar">
        {% endif %}
        <p class="profile-email">{{ email }}</p>

        <div class="profile-info">
            <div class="info-item">
                <span class="info-label">Логин:</span>
                <span class="info-value">{{ username }}</span>
            </div>
        </div>

        <div class="profile-actions">
            <button>
                <a href="{% url 'profile_edit' %}" class="button">Редактировать профиль</a>
            </button>
            <button>
                <a href="{% url 'change_password' %}" class="button">Сменить пароль</a>
            </button>
            <!-- Добавляем кнопку "Вернуться на главную" -->
            <button>
                <a href="{% url 'main' %}" class="button">Вернуться на главную</a>
            </button>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="logout-btn">Выйти из аккаунта</button>
            </form>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const logoutForm = document.querySelector('form[action="{% url 'logout' %}"]');
    if (logoutForm) {
        logoutForm.addEventListener('submit', function(e) {
            if (!confirm('Вы уверены, что хотите выйти?')) {
                e.preventDefault();
            }
        });
    }
});
</script>
</body>
</html>
