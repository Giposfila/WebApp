{%extends 'boardsapp/base.html'%}
{%block content%}
<div class="form-container">
    <h2 class="form-title">Создание новой доски</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-submit">Создать доску</button>
    </form>
    <a href="{% url 'main' %}" class="btn-back"><button> Вернуться на главную</button></a>
</div>
{%endblock%}

<script>
document.querySelector('form').addEventListener('submit', function(e) {
    e.preventDefault();
    const form = this;
    const formData = new FormData(form);

    fetch('{% url "boardcreate" %}', {
        method: 'POST',
        body: formData,
        headers: {
            'X-CSRFToken': '{{ csrf_token }}',
            'X-Requested-With': 'XMLHttpRequest'
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            window.location.href = '{% url "main" %}';
        } else {
            // Показываем ошибки
            alert(data.error || 'Ошибка при создании доски');
        }
    });
});
</script>
