{%extends 'boardsapp/base.html'%}
{%block content%}
<div class="form-container">
    <h2 class="form-title">Создание новой доски</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-submit">Создать доску</button>
    </form>
    <a href="{% url 'main' %}" class="btn-back"><button> Вернуться на главную</button></a>
</div>
{%endblock%}
