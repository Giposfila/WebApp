<!-- templates/profile.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль пользователя</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'usersapp/css/profilestyle.css' %}">
</head>
<body>
    <div class="profile-container">

        <h2>Профиль пользователя</h2>

        {% if user.profile.avatar %}
            <img src="{{ user.profile.avatar.url }}" alt="Аватар" class="profile-avatar">
        {% else %}
            <img src="{% static 'usersapp/img/profileicon.png' %}" alt="Аватар" class="profile-avatar">
        {% endif %}

        <p class="profile-email">{{ user.email }}</p>

        <div class="profile-info">
            <div class="info-item">
                <span class="info-label">Логин:</span>
                <span class="info-value">{{ user.username }}</span>
            </div>
        </div>

        <div class="profile-actions">
            <!-- Редактировать можно только свой профиль -->
            {% if user == request.user %}
                <button><a href="{% url 'profile_edit' %}" class="button">Редактировать профиль</a></button>
                <button><a href="{% url 'change_password' %}" class="button">Сменить пароль</a></button>
            {% endif %}

            <!-- Кнопка "Главная" всегда видна -->
              {% if user != request.user %}
            <button id="friendbutton" onclick="sendFriendRequest({{ user.id }})"><a href="" class="button">Добавить в друзья</a></button>
            {%endif%}
            <button><a href="{% url 'main' %}" class="button">Вернуться на главную</a></button>

            <!-- Выход — только если это профиль текущего пользователя -->
            {% if user == request.user %}
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="logout-btn">Выйти из аккаунта</button>
                </form>
            {% endif %}
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const logoutForm = document.querySelector('form[action="{% url 'logout' %}"]');
    if (logoutForm) {
        logoutForm.addEventListener('submit', function(e) {
            if (!confirm('Вы уверены, что хотите выйти?')) {
                e.preventDefault();
            }
        });
    }
});

    function sendFriendRequest(userId) {

    fetch(`/send-request/${userId}/`, {
        method: 'GET',
        headers: {
            'X-Requested-With': 'XMLHttpRequest',
            'X-CSRFToken': getCookie('csrftoken'), // если используется CSRF
        }
    })
    .then(response => response.json())
    .then(data => {
        const container = document.getElementById('friend-button-container');

        if (data.status === 'success' || data.status === 'info') {
            container.innerHTML = `
                <button class="btn btn-success btn-sm" disabled title="Запрос отправлен">
                    <i class="fas fa-check"></i>
                </button>
            `;
        } else {
            alert('Ошибка: ' + data.message);
        }
    });
}

// Вспомогательная функция для получения CSRF-токена
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
</body>
</html>
