<!-- templates/login.html -->
<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'usersapp/css/loginstyle.css' %}">
    <title>Вход</title>
</head>
<body>
    <div class="login-form">
        <h2>Войти на сайт</h2>
        <form method="post">
            {% csrf_token %}
            {{form}}
            {% if form.errors %}
                <div class="error">
                    {{ form.errors }}
                </div>
            {% endif %}
            <button type="submit">Войти</button>
        </form>
        <p>
            Забыли пароль? <a href="forgotpassword/"><button>Восстановить</button></a>
        </p>
    </div>
</body>
</html>
