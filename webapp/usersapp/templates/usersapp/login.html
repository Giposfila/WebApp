<!-- templates/login.html -->
<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'usersapp/css/loginstyle.css' %}">
    <title>Вход</title>
</head>
<body>
    <div class="login-form">
        <h2>Войти на сайт</h2>
        <form method="post">
            {% csrf_token %}
            {{form}}
            <button type="submit">Войти</button>
        </form>
        <p>
            Забыли пароль? <a href="{%url 'forgotpassword'%}"><button>Восстановить</button></a>
        </p>
    </div>
</body>
</html>
