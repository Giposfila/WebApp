<!DOCTYPE html>
<html lang="ru">
<head>
    {%load static%}
    <link rel="stylesheet" href="{%static 'usersapp/css/mainstyle.css'%}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Tasks</title>
    <style>

    </style>
</head>
<body>

<header>
    <h1>E-Tasks</h1>
</header>

<div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="groups">
            <h3>Группы</h3>
            <div class="group-item">Команда 1</div>
            <div class="group-item">Проект Х</div>
            <button>Создать группу</button>
        </div>

        <div class="filters">
            <h3>Фильтры</h3>
            <div class="filter-item">Активные</div>
            <div class="filter-item">Завершенные</div>
            <div class="filter-item">Просроченные</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <h2>Мои задачи</h2>

        <div class="task">
            <div class="task-header">
                <span class="task-title">Подготовить отчет</span>
                <span class="task-priority priority-high">Высокий</span>
            </div>
            <div class="task-details">
                <span>Срок: 25.10.2024</span>
                <span>Исполнитель: Иван</span>
            </div>
        </div>

        <div class="task">
            <div class="task-header">
                <span class="task-title">Встреча с клиентом</span>
                <span class="task-priority priority-medium">Средний</span>
            </div>
            <div class="task-details">
                <span>Срок: 26.10.2024</span>
                <span>Исполнитель: Мария</span>
            </div>
        </div>

        <div class="project-info">
            <strong>Проект Х</strong> 3 участника | 8 задач
            <button>Присоединиться</button>
        </div>
    </div>
</div>
</body>
</html>
