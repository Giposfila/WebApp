<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'usersapp/css/loginstyle.css' %}">
    <title>Новый пароль</title>
    <style>
        /* Основные стили */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #cceeff, #ffffff 50%, #e0f7ff);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .reset-new-container {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            animation: fadeIn 0.6s ease-out;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Явные стили для полей ввода */
        .reset-new-container input[type="password"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.9);
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .reset-new-container input[type="password"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
            outline: none;
            background: white;
        }

        /* Стили кнопки */
        .reset-new-container .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #a2d9f0 0%, #d6b4f7 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            margin-top: 10px;
        }

        .reset-new-container .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        /* Остальные стили */
        .reset-new-title {
            color: #4a4a4a;
            margin: 0 0 25px;
            font-size: 2.2rem;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(135deg, #a2d9f0 0%, #d6b4f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .password-hint {
            font-size: 0.8rem;
            color: #666;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        /* Анимация */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="reset-new-container">
        <h2 class="reset-new-title">Установите новый пароль</h2>
        <form method="post">
            {% csrf_token %}

            <!-- Поле нового пароля -->
            <div class="form-group">
                <label for="id_new_password1">Новый пароль:</label>
                <input type="password"
                       name="new_password1"
                       id="id_new_password1"
                       class="form-control"
                       required>
                <div class="password-hint">Пароль должен содержать не менее 8 символов</div>
            </div>

            <!-- Поле подтверждения пароля -->
            <div class="form-group">
                <label for="id_new_password2">Подтвердите пароль:</label>
                <input type="password"
                       name="new_password2"
                       id="id_new_password2"
                       class="form-control"
                       required>
            </div>

            <button type="submit" class="submit-btn">Сохранить пароль</button>

            {% if form.errors %}
                <div class="error-message" style="color: #e74c3c; margin-top: 15px;">
                    {% for field, errors in form.errors.items %}
                        {% for error in errors %}
                            {{ error }}<br>
                        {% endfor %}
                    {% endfor %}
                </div>
            {% endif %}
        </form>
    </div>
</body>
</html>
