{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Восстановление пароля</title>
    <link rel="stylesheet" href="{% static 'usersapp/css/forgotpassword.css' %}">
</head>
<body>
    <div class="forgot-container">
        <h2 class="forgot-title">Восстановление пароля</h2>
        <p class="forgot-text">Введите email для восстановления пароля</p>
        <form method="post" class="forgot-form">
            {% csrf_token %}
            <div class="form-group-forgot">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-input-forgot" required>
            </div>
            <button type="submit" class="forgot-button">Отправить</button>
        </form>
        <div class="forgot-links">
            <a href="{% url 'login' %}">Вернуться к входу</a>
        </div>
    </div>
</body>
</html>
