<!-- templates/profile.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль пользователя</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'usersapp/css/profilestyle.css' %}">
</head>
<body>
    <div class="profile-container">
        <h2>Мой профиль</h2>
        <img src="{% static 'usersapp/img/profileicon.png' %}" alt="Аватар" class="profile-avatar">
        <p class="profile-email">ivan@example.com</p>

        <div class="profile-info">
            <div class="info-item">
                <span class="info-label">Имя:</span>
                <span class="info-value">Иван</span>
            </div>
            <div class="info-item">
                <span class="info-label">Фамилия:</span>
                <span class="info-value">Иванов</span>
            </div>
            <div class="info-item">
                <span class="info-label">Дата рождения:</span>
                <span class="info-value">01.01.1990</span>
            </div>
            <div class="info-item">
                <span class="info-label">Город:</span>
                <span class="info-value">Москва</span>
            </div>
        </div>

        <div class="profile-actions">
            <a class="button">Редактировать профиль</a>
            <a class="button">Сменить пароль</a>
        </div>
    </div>
</body>
</html>
