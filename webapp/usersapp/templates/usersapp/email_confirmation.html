<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'usersapp/css/loginstyle.css' %}">
    <title>Подтверждение email</title>
</head>
<body>
    <div class="login-form">
        <h2>Подтверждение email</h2>
        <p>На вашу почту был отправлен код подтверждения. Введите его ниже:</p>
        <form method="post">
            {% csrf_token %}
            {{ form }}
            <button type="submit">Подтвердить</button>
        </form>
        <p>Не получили код? <a href="{% url 'resend_code' %}">Отправить повторно</a></p>
    </div>
</body>
<style>
    /* Основные стили */
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #cceeff, #ffffff 50%, #e0f7ff);
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #333;
}

.login-form {
    background: rgba(255, 255, 255, 0.97);
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    width: 100%;
    max-width: 450px;
    padding: 40px;
    animation: fadeIn 0.6s ease-out;
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-sizing: border-box;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
}

.login-form h2 {
    color: #4a4a4a;
    margin: 0 0 25px;
    font-size: 2.2rem;
    font-weight: 700;
    text-align: center;
    background: linear-gradient(135deg, #a2d9f0 0%, #d6b4f7 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* Форма */
.login-form p {
    text-align: center;
    margin: 0 0 20px;
    color: #666;
    font-size: 1rem;
}

.login-form form {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.login-form input[type="text"],
.login-form input[type="number"] {
    width: 100%;
    padding: 15px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 1rem;
    transition: all 0.3s;
    background: rgba(255, 255, 255, 0.9);
    box-sizing: border-box;
}

.login-form input:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
    outline: none;
    background: white;
}

/* Кнопка */
.login-form button[type="submit"] {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    background: linear-gradient(135deg, #a2d9f0 0%, #d6b4f7 100%);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
}

.login-form button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
}

/* Ссылка на повторную отправку */
.login-form a {
    display: inline-block;
    text-align: center;
    color: #667eea;
    text-decoration: none;
    font-weight: 600;
    transition: all 0.3s;
    margin-top: 15px;
}

.login-form a:hover {
    color: #764ba2;
    text-decoration: underline;
}

/* Ошибки формы */
.login-form .errorlist {
    background: #f8d7da;
    color: #721c24;
    padding: 12px;
    border-radius: 8px;
    margin: 15px 0;
    border: 1px solid #f5c6cb;
    text-align: center;
    font-size: 0.9rem;
}
</style>
</html>
