<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'usersapp/css/loginstyle.css' %}">
    <title>Подтверждение сброса пароля</title>
    <style>
        /* Основные стили */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #cceeff, #ffffff 50%, #e0f7ff);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .reset-confirm-container {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            animation: fadeIn 0.6s ease-out;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Стили полей ввода */
        .reset-confirm-container .form-control {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.9);
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .reset-confirm-container .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
            outline: none;
            background: white;
        }

        /* Стили кнопки */
        .reset-confirm-container .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #a2d9f0 0%, #d6b4f7 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .reset-confirm-container .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        /* Остальные стили */
        .reset-confirm-title {
            color: #4a4a4a;
            margin: 0 0 25px;
            font-size: 2.2rem;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(135deg, #a2d9f0 0%, #d6b4f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .reset-confirm-text {
            text-align: center;
            margin: 0 0 20px;
            color: #666;
            font-size: 1rem;
        }

        #resend-timer {
            color: #888;
            font-size: 0.9rem;
            margin-left: 5px;
        }

        .text-center {
            text-align: center;
            margin-top: 15px;
        }

        .text-center a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .text-center a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        /* Анимация */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="reset-confirm-container">
        <h2 class="reset-confirm-title">Подтверждение сброса пароля</h2>
        <p class="reset-confirm-text">На вашу почту был отправлен код подтверждения. Введите его ниже:</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <input type="text"
                       name="{{ form.code.name }}"
                       id="{{ form.code.id_for_label }}"
                       class="form-control"
                       placeholder="Введите код из письма">
            </div>
            <button type="submit" class="submit-btn">Подтвердить</button>
        </form>
        <input type="hidden" id="last-sent-time" value="{{ last_code_sent_time|default:0 }}">
        <p class="text-center">
            Не получили код?
            <a href="{% url 'resend_password_code' %}" id="resend-link">Отправить повторно</a>
            <span id="resend-timer"></span>
        </p>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const lastSentTimeInput = document.getElementById('last-sent-time');
            if (!lastSentTimeInput) return;

            const lastSentTime = parseFloat(lastSentTimeInput.value);
            if (isNaN(lastSentTime)) return;

            startTimer(lastSentTime);
        });

        function startTimer(lastSentTime) {
            const timerElement = document.getElementById('resend-timer');
            const resendLink = document.getElementById('resend-link');
            const cooldownPeriod = 60 * 1000; // 60 секунд
            const now = new Date().getTime();
            const endTime = lastSentTime * 1000 + cooldownPeriod;

            let remaining = endTime - now;

            if (remaining <= 0) {
                timerElement.textContent = '';
                resendLink.style.display = 'inline';
                return;
            }

            resendLink.style.display = 'none';

            const intervalId = setInterval(() => {
                remaining = endTime - new Date().getTime();
                if (remaining <= 0) {
                    clearInterval(intervalId);
                    timerElement.textContent = '';
                    resendLink.style.display = 'inline';
                } else {
                    const seconds = Math.floor(remaining / 1000);
                    timerElement.textContent = ` Повторно через ${seconds} секунд`;
                }
            }, 1000);
        }
    </script>
</body>
</html>
